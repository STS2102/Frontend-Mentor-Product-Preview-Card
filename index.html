<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="./styles/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main class="Card">

    <div class = "Img-Box">
      <picture>
        <source srcset="./images/image-product-mobile.jpg" media="(max-width: 24em)">
        <img class="product-image" src="./images/image-product-desktop.jpg" alt="Product picture: perfume bottle.">
      </picture>
      </div>
  <div class="Card-Text">
  <h2 class="Product-Type">PERFUME</h2>

  <h1 class = "Title">Gabrielle Essence Eau De Parfum</h1>

  <p class="Description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
  <div class="Prices">
  <div class="New-Price">$149.99</div>
  <div class="Old-Price">$169.99</div>
  </div>
  <div class="Add">
    <div class="Trolley-Box">
    <img src="./images/icon-cart.svg" alt="Shopping trolley icon.">
    </div>
    <p class="Add-Text">Add to Cart</p>
  </div>
  </div>
  </main>
</body>
</html>
